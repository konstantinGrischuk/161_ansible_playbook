---
- name: Clean Chromium profile on 402 group PCs
  hosts: "402"
  become: yes
  gather_facts: false
  ignore_unreachable: yes

  vars:
    # ВАЖНО: проверьте, что здесь правильный пользователь.
    # Если на ПК вход под 'user', а не 'student', измените это.
    target_user: "user" 
    proxy_env:
      http_proxy: "http://10.0.2.52:3128"
      https_proxy: "http://10.0.2.52:3128"
      ftp_proxy: "http://10.0.2.52:3128"
      HTTP_PROXY: "http://10.0.2.52:3128"
      HTTPS_PROXY: "http://10.0.2.52:3128"
      FTP_PROXY: "http://10.0.2.52:3128"
      no_proxy: "localhost,127.0.0.1,.local,10.0.0.0/8,.licey.loc"
      NO_PROXY: "localhost,127.0.0.1,.local,10.0.0.0/8,.licey.loc"

  tasks:
    - name: Remove Chromium config directory
      ansible.builtin.file:
        path: "/home/{{ target_user }}/.config/chromium"
        state: absent

    - name: Remove Chromium cache directory
      ansible.builtin.file:
        path: "/home/{{ target_user }}/.cache/chromium"
        state: absent

    - name: Verify directories are removed
      ansible.builtin.command: "ls -d /home/{{ target_user }}/.config/chromium /home/{{ target_user }}/.cache/chromium"
      register: dir_check
      changed_when: false
      failed_when: false

    - name: Show cleanup status
      ansible.builtin.debug:
        msg: "pc={{ inventory_hostname }} status={{ 'CLEANED' if dir_check.rc != 0 else 'FAILED TO REMOVE' }}"
