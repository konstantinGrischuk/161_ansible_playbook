---
# ================================================================
# Playbook: полная настройка IPA-клиента
# Аналог bash-скрипта fix_sssd.sh v7.0
# ================================================================

- name: Setup IPA client
  hosts: all_clients
  gather_facts: true
  become: true
  become_method: su
  become_user: root

  vars:
    ipa_domain: "licey.loc"
    ipa_server: "ipa.{{ ipa_domain }}"
    ipa_realm: "LICEY.LOC"
    # Пароль берём из Variable Group (Secret), не хардкодим
    ipa_password: "{{ lookup('env', 'IPA_PASSWORD') | default('', true) }}"

    students_home: "/mnt/home/students"
    teachers_home: "/mnt/home/teachers"

    zabbix_server: "10.205.112.6"

  tasks:

    # ---------- 0. Проверки ----------
    - name: Проверить, что IPA_PASSWORD задан
      ansible.builtin.assert:
        that:
          - ipa_password | length > 0
        fail_msg: "Переменная IPA_PASSWORD не задана"
        success_msg: "IPA_PASSWORD задан"

    - name: Проверить доступность IPA-сервера
      ansible.builtin.command: "ping -c 1 -W 2 {{ ipa_server }}"
      register: ping_result
      changed_when: false
      failed_when: ping_result.rc != 0

    # ---------- 1. Hostname ----------
    - name: Получить короткое имя хоста
      ansible.builtin.set_fact:
        short_hostname: "{{ ansible_hostname | default(inventory_hostname) | split('.') | first }}"

    - name: Предупредить, если hostname не по шаблону
      ansible.builtin.debug:
        msg: "ВНИМАНИЕ: имя '{{ short_hostname }}' не соответствует pcXXX-YY"
      when: not (short_hostname is match('^pc[0-9]{3}-[0-9]+$'))

    - name: Установить полное имя хоста
      ansible.builtin.set_fact:
        full_hostname: "{{ short_hostname }}.{{ ipa_domain }}"

    - name: Установить hostname через hostnamectl
      ansible.builtin.hostname:
        name: "{{ full_hostname }}"
        use: systemd
      when: ansible_fqdn != full_hostname

    - name: Прописать короткое имя в /etc/hostname
      ansible.builtin.copy:
        content: "{{ short_hostname }}\n"
        dest: /etc/hostname
        owner: root
        group: root
        mode: "0644"
      when: ansible_fqdn != full_hostname

    - name: Добавить запись в /etc/hosts (если нет)
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "{{ ansible_default_ipv4.address }} {{ full_hostname }} {{ short_hostname }}"
        state: present
        create: true
      when:
        - ansible_fqdn != full_hostname
        - ansible_default_ipv4 is defined

    # ---------- 2. Остановка служб ----------
    - name: Остановить sssd, autofs, nscd
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop:
        - sssd
        - autofs
        - nscd
      failed_when: false

    # ---------- 3. Удаление старой конфигурации ----------
    - name: Запустить ipa-client-install --uninstall
      ansible.builtin.command: /sbin/ipa-client-install --uninstall -U
      register: uninstall_result
      failed_when: false
      changed_when: uninstall_result.rc == 0

    - name: Удалить старые файлы конфигурации
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/ipa
        - /etc/sssd
        - /var/lib/sss
        - /var/log/sssd
        - /var/run/sssd
        - /etc/krb5.keytab
        - /etc/krb5.conf

    - name: Удалить файлы в /etc/krb5.conf.d
      ansible.builtin.shell: "rm -f /etc/krb5.conf.d/* || true"
      changed_when: false

    # ---------- 4. Создание каталогов ----------
    - name: Создать каталоги
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        mode: "{{ item.mode }}"
      loop:
        - { path: /etc/ipa, mode: "0755" }
        - { path: /etc/sssd/conf.d, mode: "0755" }
        - { path: /var/lib/ipa-client/pki, mode: "0755" }
        - { path: /var/lib/sss/db, mode: "0700" }
        - { path: /var/lib/sss/mc, mode: "0755" }
        - { path: /var/lib/sss/pipes/private, mode: "0755" }
        - { path: /var/log/sssd, mode: "0755" }
        - { path: /var/run/sssd, mode: "0755" }
        - { path: "{{ students_home }}", mode: "0755" }
        - { path: "{{ teachers_home }}", mode: "0755" }

    # ---------- 5. Kerberos ----------
    - name: Создать /etc/krb5.conf.d
      ansible.builtin.file:
        path: /etc/krb5.conf.d
        state: directory
        mode: "0755"

    - name: Создать заглушку 00-default.conf
      ansible.builtin.copy:
        content: |
          # Этот файл необходим для корректной работы Kerberos
          # Он пустой, чтобы не влиять на настройки
        dest: /etc/krb5.conf.d/00-default.conf
        owner: root
        group: root
        mode: "0644"

    - name: Создать /etc/krb5.conf
      ansible.builtin.copy:
        dest: /etc/krb5.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [libdefaults]
              default_realm = {{ ipa_realm }}
              dns_lookup_realm = false
              dns_lookup_kdc = true
              ticket_lifetime = 24h
              forwardable = true
              dns_canonicalize_hostname = false
              rdns = false
              default_ccache_name = KEYRING:persistent:%{uid}

          [realms]
              {{ ipa_realm }} = {
                  kdc = {{ ipa_server }}
                  admin_server = {{ ipa_server }}
                  kpasswd_server = {{ ipa_server }}
                  default_domain = {{ ipa_domain }}
              }

          [domain_realm]
              .{{ ipa_domain }} = {{ ipa_realm }}
              {{ ipa_domain }} = {{ ipa_realm }}

    # ---------- 6. Проверка Kerberos ----------
    - name: Проверить kinit
      ansible.builtin.shell: |
        echo "{{ ipa_password }}" | kinit admin@{{ ipa_realm }}
        klist
        kdestroy
      register: kinit_result
      changed_when: false
      failed_when: kinit_result.rc != 0

    # ---------- 7. Регистрация в IPA ----------
    - name: Зарегистрировать машину в IPA
      ansible.builtin.command: >
        /sbin/ipa-client-install
        --domain={{ ipa_domain }}
        --server={{ ipa_server }}
        --principal=admin
        -w {{ ipa_password }}
        --no-ntp
        --mkhomedir
        --unattended
        --force-join
      register: ipa_install_result
      changed_when: ipa_install_result.rc == 0
      failed_when: ipa_install_result.rc != 0

    # ---------- 8. SSSD ----------
    - name: Остановить SSSD перед правкой конфига
      ansible.builtin.systemd:
        name: sssd
        state: stopped
      failed_when: false

    - name: Создать /etc/sssd/sssd.conf
      ansible.builtin.copy:
        dest: /etc/sssd/sssd.conf
        owner: root
        group: root
        mode: "0600"
        content: |
          [domain/{{ ipa_domain }}]
          id_provider = ipa
          ipa_server = _srv_, {{ ipa_server }}
          ipa_domain = {{ ipa_domain }}
          ipa_hostname = {{ full_hostname }}
          auth_provider = ipa
          chpass_provider = ipa
          access_provider = ipa
          cache_credentials = True
          ldap_tls_cacert = /etc/ipa/ca.crt
          krb5_store_password_if_offline = True
          autofs_provider = ipa
          ipa_automount_location = default
          default_shell = /bin/bash

          homedir_substring = {{ students_home }}
          fallback_homedir = {{ teachers_home }}/%u

          [sssd]
          config_file_version = 2
          services = nss, pam, ssh, sudo, autofs
          domains = {{ ipa_domain }}

          [nss]
          [pam]
          [ssh]
          [sudo]

    # ---------- 9. Autofs ----------
    - name: Запустить ipa-client-automount
      ansible.builtin.command: /sbin/ipa-client-automount --unattended
      register: automount_result
      failed_when: false
      changed_when: automount_result.rc == 0

    - name: Создать override для autofs.service
      ansible.builtin.copy:
        dest: /etc/systemd/system/autofs.service.d/override.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Requires=sssd.service
          After=sssd.service
      notify: daemon-reload

    # ---------- 10. Права ----------
    - name: Права на /etc/sssd
      ansible.builtin.file:
        path: /etc/sssd
        owner: root
        group: root
        mode: "0711"

    - name: Определить пользователя SSSD
      ansible.builtin.set_fact:
        sssd_user: "{{ 'sssd' if 'sssd' in ansible_facts.getent_passwd else '_sssd' }}"

    - name: Права на /var/lib/sss и /var/log/sssd
      ansible.builtin.file:
        path: "{{ item }}"
        owner: "{{ sssd_user }}"
        group: "{{ sssd_user }}"
        recurse: true
      loop:
        - /var/lib/sss
        - /var/log/sssd
      failed_when: false

    # ---------- 11. Запуск служб ----------
    - name: Запустить sssd и autofs
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - sssd
        - autofs

    - name: Подождать 3 секунды
      ansible.builtin.pause:
        seconds: 3

    - name: Проверить, что службы активны
      ansible.builtin.command: "systemctl is-active {{ item }}"
      register: svc_status
      changed_when: false
      failed_when: svc_status.stdout != "active"
      loop:
        - sssd
        - autofs

    # ---------- 12. Проверка работы ----------
    - name: Очистить кэш SSSD
      ansible.builtin.command: sss_cache -E
      changed_when: false
      failed_when: false

    - name: Проверить keytab
      ansible.builtin.shell: "klist -kt /etc/krb5.keytab | grep 'host/{{ full_hostname }}'"
      register: keytab_check
      changed_when: false
      failed_when: false

    - name: Сообщить о keytab
      ansible.builtin.debug:
        msg: "{{ 'Keytab OK' if keytab_check.rc == 0 else 'Keytab НЕ содержит правильный хост!' }}"

    - name: Проверить пользователя student
      ansible.builtin.command: id student
      register: student_check
      changed_when: false
      failed_when: false

    - name: Сообщить о student
      ansible.builtin.debug:
        msg: "{{ 'student найден' if student_check.rc == 0 else 'student не найден (кэш ещё не обновился)' }}"

    # ---------- 13. Zabbix ----------
    - name: Настроить Zabbix (если установлен)
      block:
        - name: Проверить наличие zabbix_agentd.conf
          ansible.builtin.stat:
            path: /etc/zabbix/zabbix_agentd.conf
          register: zabbix_conf

        - name: Прописать Server/ServerActive/Hostname
          ansible.builtin.lineinfile:
            path: /etc/zabbix/zabbix_agentd.conf
            regexp: "{{ item.regexp }}"
            line: "{{ item.line }}"
          loop:
            - { regexp: '^Server=', line: "Server={{ zabbix_server }}" }
            - { regexp: '^ServerActive=', line: "ServerActive={{ zabbix_server }}" }
            - { regexp: '^Hostname=', line: "Hostname={{ short_hostname }}" }
          when: zabbix_conf.stat.exists
          notify: restart zabbix

    # ---------- 14. Перезапуск DM ----------
    - name: Перезапустить дисплейный менеджер
      ansible.builtin.systemd:
        name: dm
        state: restarted
      failed_when: false

    # ---------- 15. Добавить admin в wheels ----------
    - name: Проверить наличие пользователя admin
      ansible.builtin.command: id admin
      register: admin_check
      changed_when: false
      failed_when: false

    - name: Проверить наличие группы wheels
      ansible.builtin.command: getent group wheels
      register: wheels_check
      changed_when: false
      failed_when: false

    - name: Добавить admin в wheels
      ansible.builtin.user:
        name: admin
        groups: wheels
        append: true
      when:
        - admin_check.rc == 0
        - wheels_check.rc == 0
      failed_when: false

  handlers:
    - name: daemon-reload
      ansible.builtin.systemd:
        daemon_reload: true

    - name: restart zabbix
      ansible.builtin.systemd:
        name: "{{ 'zabbix-agent2' if 'zabbix-agent2' in ansible_facts.services else 'zabbix_agentd' }}"
        state: restarted
        enabled: true
      failed_when: false
