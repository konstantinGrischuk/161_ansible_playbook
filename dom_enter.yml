---
- name: Полная автоматическая настройка IPA-клиента
  hosts: 317
  become: true
  vars:
    ipa_domain: "licey.loc"
    ipa_server: "ipa.licey.loc"
    ipa_realm: "LICEY.LOC"
    ipa_password: "{{ lookup('ansible.builtin.env', 'IPA_PASSWORD') | default('', true) }}"
    students_home: "/mnt/home/students"
    teachers_home: "/mnt/home/teachers"
    zabbix_server: "10.205.112.6"

  tasks:
   - name: ОПАСНО: Вывод пароля IPA в открытый вид
      debug:
        var: ipa_password
    - name: 0. Включение PasswordAuthentication в sshd_config
      ansible.builtin.lineinfile:
        path: /etc/openssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication yes'
      notify: Restart sshd

    - name: 1. Настройка имени хоста
      block:
        - name: Вычисление короткого имени хоста
          ansible.builtin.set_fact:
            short_hostname: "{{ ansible_hostname | regex_replace('\\..*$', '') }}"

        - name: Проверка формата имени хоста (pcXXX-YY)
          ansible.builtin.debug:
            msg: "Внимание: имя {{ short_hostname }} не соответствует формату pcXXX-YY"
          when: not (short_hostname | regex_search('^pc[0-9]{3}-[0-9]+$'))

        - name: Установка полного имени хоста (FQDN)
          ansible.builtin.hostname:
            name: "{{ short_hostname }}.{{ ipa_domain }}"

        - name: Добавление записи в /etc/hosts
          ansible.builtin.lineinfile:
            path: /etc/hosts
            line: "{{ ansible_default_ipv4.address }} {{ short_hostname }}.{{ ipa_domain }} {{ short_hostname }}"
            regexp: ".*{{ short_hostname }}.{{ ipa_domain }}.*"
            state: present
          when: ansible_default_ipv4.address is defined

    - name: 2. Проверка доступности IPA-сервера
      block:
        - name: Опрос Kerberos-порта на IPA-сервере
          ansible.builtin.wait_for:
            host: "{{ ipa_server }}"
            port: 88
            timeout: 3
      rescue:
        - name: Вывод ошибки при недоступности FreeIPA
          ansible.builtin.assert:
            that: false
            fail_msg: "Ошибка: IPA-сервер {{ ipa_server }} недоступен по Kerberos порту (88)."

    - name: 3. Остановка и отключение старых служб
      ansible.builtin.service:
        name: "{{ item }}"
        state: stopped
        enabled: false
      failed_when: false
      loop:
        - sssd
        - autofs
        - nscd

    - name: 4. Удаление старой конфигурации FreeIPA
      block:
        - name: Проверка наличия ipa-client-install
          ansible.builtin.stat:
            path: /sbin/ipa-client-install
          register: ipa_client_install_bin

        - name: Запуск ipa-client-install --uninstall
          ansible.builtin.command: /sbin/ipa-client-install --uninstall -U
          failed_when: false
          when: ipa_client_install_bin.stat.exists

        - name: Очистка остаточных файлов и директорий
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /etc/ipa
            - /etc/sssd
            - /var/lib/sss
            - /var/log/sssd
            - /var/run/sssd
            - /etc/krb5.keytab
            - /etc/krb5.conf

    - name: 5. Создание структуры каталогов
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /etc/ipa
        - /etc/sssd/conf.d
        - /var/lib/ipa-client/pki
        - /var/lib/sss/db
        - /var/lib/sss/mc
        - /var/lib/sss/pipes/private
        - /var/log/sssd
        - /var/run/sssd
        - "{{ students_home }}"
        - "{{ teachers_home }}"

    - name: 6. Настройка Kerberos
      block:
        - name: Создание каталога krb5.conf.d
          ansible.builtin.file:
            path: /etc/krb5.conf.d
            state: directory
            mode: '0755'

        - name: Создание заглушки 00-default.conf
          ansible.builtin.copy:
            dest: /etc/krb5.conf.d/00-default.conf
            content: "# Файл необходим для корректной работы Kerberos\n"
            mode: '0644'

        - name: Генерация основного krb5.conf
          ansible.builtin.copy:
            dest: /etc/krb5.conf
            mode: '0644'
            content: |
              [libdefaults]
               default_realm = {{ ipa_realm }}
               dns_lookup_realm = false
               dns_lookup_kdc = true
               ticket_lifetime = 24h
               forwardable = true
               dns_canonicalize_hostname = false
               rdns = false
               default_ccache_name = KEYRING:persistent:%{uid}
              [realms]
               {{ ipa_realm }} = {
               kdc = {{ ipa_server }}
               admin_server = {{ ipa_server }}
               kpasswd_server = {{ ipa_server }}
               default_domain = {{ ipa_domain }}
               }
              [domain_realm]
               .{{ ipa_domain }} = {{ ipa_realm }}
               {{ ipa_domain }} = {{ ipa_realm }}

    - name: 7 & 8. Регистрация машины в FreeIPA
      ansible.builtin.shell: >
        /sbin/ipa-client-install
        --domain="{{ ipa_domain }}"
        --server="{{ ipa_server }}"
        --principal=admin
        -w "{{ ipa_password }}"
        --no-ntp
        --mkhomedir
        --unattended
        --force-join
      no_log: true

    - name: 9. Настройка SSSD
      ansible.builtin.copy:
        dest: /etc/sssd/sssd.conf
        mode: '0600'
        owner: root
        group: root
        content: |
          [domain/{{ ipa_domain }}]
          id_provider = ipa
          ipa_server = _srv_, {{ ipa_server }}
          ipa_domain = {{ ipa_domain }}
          ipa_hostname = {{ short_hostname }}.{{ ipa_domain }}
          auth_provider = ipa
          chpass_provider = ipa
          access_provider = ipa
          cache_credentials = True
          ldap_tls_cacert = /etc/ipa/ca.crt
          krb5_store_password_if_offline = True
          autofs_provider = ipa
          ipa_automount_location = default
          default_shell = /bin/bash
          homedir_substring = {{ students_home }}
          fallback_homedir = {{ teachers_home }}/%u
          [sssd]
          config_file_version = 2
          services = nss, pam, ssh, sudo, autofs
          domains = {{ ipa_domain }}
          [nss]
          [pam]
          [ssh]
          [sudo]

    - name: 10. Настройка Autofs
      block:
        - name: Запуск настройки автодонтирования IPA
          ansible.builtin.command: /sbin/ipa-client-automount --unattended
          failed_when: false

        - name: Создание директории для override autofs
          ansible.builtin.file:
            path: /etc/systemd/system/autofs.service.d
            state: directory
            mode: '0755'

        - name: Создание override.conf для autofs
          ansible.builtin.copy:
            dest: /etc/systemd/system/autofs.service.d/override.conf
            content: |
              [Unit]
              Requires=sssd.service
              After=sssd.service
          notify: Systemd daemon-reload

    - name: 11. Выставление прав доступа для SSSD
      block:
        - name: Определение системного пользователя SSSD
          ansible.builtin.shell: "getent passwd | grep -E '^(sssd|_sssd):' | cut -d: -f1"
          register: sssd_user_check
          failed_when: false
          changed_when: false

        - name: Установка переменной sssd_user
          ansible.builtin.set_fact:
            sssd_user: "{{ sssd_user_check.stdout if sssd_user_check.stdout != '' else '_sssd' }}"

        - name: Выставление прав на директории SSSD
          ansible.builtin.file:
            path: "{{ item.path }}"
            owner: "{{ item.owner | default('root') }}"
            group: "{{ item.group | default('root') }}"
            mode: "{{ item.mode }}"
            state: directory
          loop:
            - { path: '/etc/sssd', mode: '0711' }
            - { path: '/var/lib/sss', mode: '0755', owner: "{{ sssd_user }}", group: "{{ sssd_user }}" }
            - { path: '/var/lib/sss/db', mode: '0700', owner: "{{ sssd_user }}", group: "{{ sssd_user }}" }
            - { path: '/var/lib/sss/mc', mode: '0755', owner: "{{ sssd_user }}", group: "{{ sssd_user }}" }
            - { path: '/var/lib/sss/pipes', mode: '0755', owner: "{{ sssd_user }}", group: "{{ sssd_user }}" }
            - { path: '/var/lib/sss/pipes/private', mode: '0755', owner: "{{ sssd_user }}", group: "{{ sssd_user }}" }
            - { path: '/var/log/sssd', mode: '0755', owner: "{{ sssd_user }}", group: "{{ sssd_user }}" }
            - { path: '/var/run/sssd', mode: '0755', owner: "{{ sssd_user }}", group: "{{ sssd_user }}" }

    - name: 12. Запуск и включение служб SSSD и Autofs
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - sssd
        - autofs

    - name: 13. Сброс кэша SSSD
      ansible.builtin.command: sss_cache -E
      failed_when: false

    - name: 14. Опциональная настройка Zabbix агента
      block:
        - name: Проверка наличия конфига Zabbix
          ansible.builtin.stat:
            path: /etc/zabbix/zabbix_agentd.conf
          register: zabbix_conf

        - name: Конфигурирование параметров Zabbix
          ansible.builtin.lineinfile:
            path: /etc/zabbix/zabbix_agentd.conf
            regexp: "{{ item.regexp }}"
            line: "{{ item.line }}"
          loop:
            - { regexp: '^Server=', line: "Server={{ zabbix_server }}" }
            - { regexp: '^ServerActive=', line: "ServerActive={{ zabbix_server }}" }
            - { regexp: '^Hostname=', line: "Hostname={{ short_hostname }}" }
          when: zabbix_conf.stat.exists
          notify: Restart Zabbix

    - name: 15. Перезапуск дисплейного менеджера
      ansible.builtin.service:
        name: dm
        state: restarted
      failed_when: false

    - name: 17. Добавление доменного админа в локальную группу wheels
      ansible.builtin.user:
        name: admin
        groups: wheels
        append: true
      failed_when: false

  handlers:
    - name: Restart sshd
      ansible.builtin.service:
        name: sshd
        state: restarted

    - name: Systemd daemon-reload
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart Zabbix
      ansible.builtin.shell: |
        if systemctl list-unit-files | grep -q "zabbix_agentd.service"; then
          systemctl enable zabbix_agentd && systemctl restart zabbix_agentd
        elif systemctl list-unit-files | grep -q "zabbix-agent2.service"; then
          systemctl enable zabbix-agent2 && systemctl restart zabbix-agent2
        fi
      failed_when: false
