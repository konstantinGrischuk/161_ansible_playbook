---
- name: Install TRIK Studio on group 403 PCs
  hosts: "403"
  become: true
  gather_facts: false

  vars:
    proxy_url: "http://10.0.2.52:3128"
    proxy_env:
      http_proxy: "{{ proxy_url }}"
      https_proxy: "{{ proxy_url }}"
      ftp_proxy: "{{ proxy_url }}"
      HTTP_PROXY: "{{ proxy_url }}"
      HTTPS_PROXY: "{{ proxy_url }}"
      FTP_PROXY: "{{ proxy_url }}"
      no_proxy: "localhost,127.0.0.1,.local,10.0.0.0/8,.licey.loc"
      NO_PROXY: "localhost,127.0.0.1,.local,10.0.0.0/8,.licey.loc"

  tasks:
    - name: Update APT cache
      community.general.apt_rpm:
        update_cache: true
      environment: "{{ proxy_env }}"
      register: apt_update
      retries: 5
      delay: 10
      until: apt_update is success
      ignore_unreachable: true

    - name: Install TRIK Studio package
      community.general.apt_rpm:
        pkg: trik-studio
        state: present
      environment: "{{ proxy_env }}"
      register: install_result
      ignore_unreachable: true
      # Защита от ложного падения таски из-за варнингов "egrep is obsolescent" в ALT Linux:
      failed_when:
        - install_result.failed
        - "not ('egrep: warning' in install_result.msg and install_result.rc | default(0) == 0)"

    - name: Query installed TRIK Studio version
      ansible.builtin.command:
        cmd: rpm -q --qf '%{VERSION}' trik-studio
      register: ts_ver
      changed_when: false
      failed_when: false
      ignore_unreachable: true

    - name: Report TRIK Studio version per host
      ansible.builtin.debug:
        msg: >-
          pc={{ inventory_hostname }}
          trik_studio={{ ts_ver.stdout if (ts_ver.rc is defined and ts_ver.rc == 0) else 'NOT INSTALLED/UNREACHABLE' }}
