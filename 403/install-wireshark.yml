---
- name: Install Wireshark on group 403 PCs
  hosts: "403"
  become: true
  gather_facts: false

  vars:
    proxy_url: "http://10.0.2.52:3128"
    proxy_env:
      http_proxy: "{{ proxy_url }}"
      https_proxy: "{{ proxy_url }}"
      ftp_proxy: "{{ proxy_url }}"
      HTTP_PROXY: "{{ proxy_url }}"
      HTTPS_PROXY: "{{ proxy_url }}"
      FTP_PROXY: "{{ proxy_url }}"
      no_proxy: "localhost,127.0.0.1,.local,10.0.0.0/8,.licey.loc"
      NO_PROXY: "localhost,127.0.0.1,.local,10.0.0.0/8,.licey.loc"

  tasks:
    - name: Update APT cache safely
      community.general.apt_rpm:
        update_cache: true
      environment: "{{ proxy_env }}"
      register: apt_update
      retries: 3
      delay: 10
      until: apt_update is success
      ignore_unreachable: true # Пропустит хост, если он выключен

    - name: Install Wireshark package
      community.general.apt_rpm:
        pkg: wireshark
        state: present
      environment: "{{ proxy_env }}"
      register: install_result
      ignore_unreachable: true
      # Игнорируем ложные сбои из-за варнингов egrep в stderr:
      failed_when: 
        - install_result.failed
        - "'E: Установка завершена неудачно' in install_result.msg or 'E: Unable to fetch some archives' in install_result.msg or install_result.msg == ''"

    - name: Query installed Wireshark version
      ansible.builtin.command:
        cmd: rpm -q --qf '%{VERSION}' wireshark
      register: ws_ver
      changed_when: false
      failed_when: false
      ignore_unreachable: true

    - name: Report Wireshark version per host
      ansible.builtin.debug:
        msg: >-
          pc={{ inventory_hostname }}
          wireshark={{ ws_ver.stdout if (ws_ver.rc is defined and ws_ver.rc == 0) else 'NOT INSTALLED/UNREACHABLE' }}
