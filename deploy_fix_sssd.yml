---
- name: Развернуть и запустить fix_sssd.sh на клиентах
  hosts: "317"
  become: yes
  gather_facts: no

  vars:
    fix_script_path: /root/fix_sssd.sh

  tasks:

    - name: Удалить старый fix_sssd.sh (если есть)
      ansible.builtin.file:
        path: "{{ fix_script_path }}"
        state: absent

    - name: Создать новый fix_sssd.sh с содержимым скрипта
      ansible.builtin.copy:
        dest: "{{ fix_script_path }}"
        owner: root
        group: root
        mode: '0700'
        content: |
          #!/bin/bash
          # ================================================================
          # Скрипт для ПОЛНОЙ автоматической настройки IPA-клиента
          # Версия: 7.0 (Финальная, с исправлением всех проблем)
          # Дата: 2026-09-04
          # ================================================================

          set -e

          RED='\033[0;31m'
          GREEN='\033[0;32m'
          YELLOW='\033[1;33m'
          BLUE='\033[0;34m'
          NC='\033[0m'

          log_info()  { echo -e "${BLUE}[INFO]${NC} $1"; }
          log_ok()    { echo -e "${GREEN}[OK]${NC} $1"; }
          log_warn()  { echo -e "${YELLOW}[WARN]${NC} $1"; }
          log_error() { echo -e "${RED}[ERROR]${NC} $1"; }
          print_sep() { echo "================================================================"; }

          IPA_DOMAIN="licey.loc"
          IPA_SERVER="ipa.${IPA_DOMAIN}"
          IPA_REALM="LICEY.LOC"
          IPA_PASSWORD=",tkrj,hfpbt18"

          STUDENTS_HOME="/mnt/home/students"
          TEACHERS_HOME="/mnt/home/teachers"

          if [ "$EUID" -ne 0 ]; then
              log_error "Скрипт должен запускаться от root (sudo)"
              exit 1
          fi

          print_sep
          log_info "Начало автоматической настройки IPA-клиента"
          log_info "Версия скрипта: 7.0"
          print_sep

          # 1. ОПРЕДЕЛЕНИЕ ИМЕНИ ХОСТА
          log_info "Определение имени хоста..."
          if [ -f /etc/hostname ]; then
              SHORT_HOSTNAME=$(cat /etc/hostname | tr -d ' \n')
          else
              SHORT_HOSTNAME=$(hostname -s)
          fi
          SHORT_HOSTNAME=$(echo "$SHORT_HOSTNAME" | cut -d. -f1)
          if [[ ! "$SHORT_HOSTNAME" =~ ^pc[0-9]{3}-[0-9]+$ ]]; then
              log_warn "Имя хоста '$SHORT_HOSTNAME' не соответствует формату pcXXX-YY"
              log_info "Используем текущее имя: $SHORT_HOSTNAME"
          fi
          FULL_HOSTNAME="${SHORT_HOSTNAME}.${IPA_DOMAIN}"
          log_ok "Короткое имя: $SHORT_HOSTNAME"
          log_ok "Полное имя:  $FULL_HOSTNAME"

          if [ "$(hostname -f)" != "$FULL_HOSTNAME" ]; then
              log_info "Устанавливаем правильное имя хоста..."
              hostnamectl set-hostname "$FULL_HOSTNAME"
              echo "$SHORT_HOSTNAME" > /etc/hostname
              if ! grep -q "$FULL_HOSTNAME" /etc/hosts; then
                  IP_ADDR=$(ip -4 addr show | grep -oP '(?<=inet\s)\d+(\.\d+){3}' | grep -v '127.0.0.1' | head -1)
                  if [ -n "$IP_ADDR" ]; then
                      echo "$IP_ADDR $FULL_HOSTNAME $SHORT_HOSTNAME" >> /etc/hosts
                      log_ok "Добавлена запись в /etc/hosts"
                  fi
              fi
              log_ok "Имя хоста установлено"
          fi

          # 2. ПРОВЕРКА ДОСТУПНОСТИ IPA
          log_info "Проверка доступности IPA-сервера..."
          if ! ping -c 1 -W 2 "$IPA_SERVER" > /dev/null 2>&1; then
              log_error "IPA-сервер $IPA_SERVER недоступен"
              log_info "Проверьте сеть или имя сервера"
              exit 1
          fi
          log_ok "IPA-сервер доступен"

          # 3. ОСТАНОВКА СЛУЖБ
          log_info "Остановка служб..."
          systemctl stop sssd 2>/dev/null || true
          systemctl stop autofs 2>/dev/null || true
          systemctl stop nscd 2>/dev/null || true
          systemctl disable nscd 2>/dev/null || true
          log_ok "Службы остановлены"

          # 4. УДАЛЕНИЕ СТАРОЙ КОНФИГУРАЦИИ
          log_info "Удаление старой конфигурации..."
          if [ -f /sbin/ipa-client-install ]; then
              log_info "Запуск ipa-client-install --uninstall..."
              /sbin/ipa-client-install --uninstall -U 2>/dev/null || true
          fi
          rm -rf /etc/ipa
          rm -rf /etc/sssd
          rm -rf /var/lib/sss
          rm -rf /var/log/sssd
          rm -rf /var/run/sssd
          rm -f /etc/krb5.keytab
          rm -f /etc/krb5.conf
          rm -f /etc/krb5.conf.d/* 2>/dev/null || true
          log_ok "Старая конфигурация удалена"

          # 5. СОЗДАНИЕ КАТАЛОГОВ
          log_info "Создание структуры каталогов..."
          mkdir -p /etc/ipa
          mkdir -p /etc/sssd/conf.d
          mkdir -p /var/lib/ipa-client/pki
          mkdir -p /var/lib/sss/{db,mc,pipes/private}
          mkdir -p /var/log/sssd
          mkdir -p /var/run/sssd
          mkdir -p "$STUDENTS_HOME" "$TEACHERS_HOME"
          log_ok "Каталоги созданы"

          # 6. НАСТРОЙКА KERBEROS
          log_info "Настройка Kerberos..."
          mkdir -p /etc/krb5.conf.d
          chmod 755 /etc/krb5.conf.d
          cat > /etc/krb5.conf.d/00-default.conf << 'EOF'
          # Этот файл необходим для корректной работы Kerberos
          # Он пустой, чтобы не влиять на настройки
          EOF
          chmod 644 /etc/krb5.conf.d/00-default.conf

          cat > /etc/krb5.conf << 'EOF'
          [libdefaults]
              default_realm = LICEY.LOC
              dns_lookup_realm = false
              dns_lookup_kdc = true
              ticket_lifetime = 24h
              forwardable = true
              dns_canonicalize_hostname = false
              rdns = false
              default_ccache_name = KEYRING:persistent:%{uid}

          [realms]
              LICEY.LOC = {
                  kdc = ipa.licey.loc
                  admin_server = ipa.licey.loc
                  kpasswd_server = ipa.licey.loc
                  default_domain = licey.loc
              }

          [domain_realm]
              .licey.loc = LICEY.LOC
              licey.loc = LICEY.LOC
          EOF
          chmod 644 /etc/krb5.conf
          log_ok "Kerberos настроен"

          # 7. ПРОВЕРКА KERBEROS
          log_info "Проверка Kerberos..."
          if echo "$IPA_PASSWORD" | kinit admin@"$IPA_REALM" 2>/dev/null; then
              log_ok "Kerberos работает"
              klist
              kdestroy 2>/dev/null || true
          else
              log_error "Kerberos не работает. Проверьте пароль администратора."
              log_info "Пароль в скрипте: $IPA_PASSWORD"
              exit 1
          fi

          # 8. РЕГИСТРАЦИЯ В IPA
          log_info "Регистрация машины в FreeIPA..."
          if /sbin/ipa-client-install \
              --domain="$IPA_DOMAIN" \
              --server="$IPA_SERVER" \
              --principal=admin \
              -w "$IPA_PASSWORD" \
              --no-ntp \
              --mkhomedir \
              --enable-dns-updates \
              --unattended \
              --force-join 2>&1; then
              log_ok "Машина успешно зарегистрирована в IPA"
          else
              log_error "Ошибка регистрации в IPA"
              log_info "Смотрите лог: /var/log/ipaclient-install.log"
              exit 1
          fi

          # 9. НАСТРОЙКА SSSD
          log_info "Настройка SSSD..."
          systemctl stop sssd 2>/dev/null || true
          cat > /etc/sssd/sssd.conf << EOF
          [domain/$IPA_DOMAIN]
          id_provider = ipa
          ipa_server = _srv_, $IPA_SERVER
          ipa_domain = $IPA_DOMAIN
          ipa_hostname = $FULL_HOSTNAME
          auth_provider = ipa
          chpass_provider = ipa
          access_provider = ipa
          cache_credentials = True
          ldap_tls_cacert = /etc/ipa/ca.crt
          krb5_store_password_if_offline = True
          autofs_provider = ipa
          ipa_automount_location = default
          default_shell = /bin/bash
          enumerate = true

          homedir_substring = /mnt/home
          fallback_homedir = /var/tmp/local_home/%u

          [sssd]
          config_file_version = 2
          services = nss, pam, ssh, sudo, autofs
          domains = $IPA_DOMAIN

          [nss]
          [pam]
          [ssh]
          [sudo]
          EOF
          chmod 600 /etc/sssd/sssd.conf
          log_ok "SSSD настроен"

          # 10. НАСТРОЙКА AUTOFS
          log_info "Настройка autofs..."
          if [ -f /sbin/ipa-client-automount ]; then
              /sbin/ipa-client-automount --unattended 2>/dev/null || true
          fi
          AUTOFS_OVERRIDE_DIR="/etc/systemd/system/autofs.service.d"
          mkdir -p "$AUTOFS_OVERRIDE_DIR"
          cat > "$AUTOFS_OVERRIDE_DIR/override.conf" << EOF
          [Unit]
          Requires=sssd.service
          After=sssd.service create-local-fallbacks.service
          EOF
          systemctl daemon-reload
          log_ok "Autofs настроен"

          # 11. ПРАВА
          log_info "Установка прав доступа..."
          SSSD_USER=$(getent passwd | grep -E "^(sssd|_sssd):" | cut -d: -f1)
          if [ -z "$SSSD_USER" ]; then
              SSSD_USER="_sssd"
          fi
          chown root:root /etc/sssd
          chmod 711 /etc/sssd
          chown root:root /etc/sssd/sssd.conf
          chmod 600 /etc/sssd/sssd.conf
          if id "$SSSD_USER" &>/dev/null; then
              chown -R "$SSSD_USER":"$SSSD_USER" /var/lib/sss 2>/dev/null || true
              chown -R "$SSSD_USER":"$SSSD_USER" /var/log/sssd 2>/dev/null || true
          fi
          chmod 755 /var/lib/sss
          chmod 700 /var/lib/sss/db
          chmod 755 /var/lib/sss/mc
          chmod 755 /var/lib/sss/pipes
          chmod 755 /var/lib/sss/pipes/private
          chmod 755 /var/run/sssd
          log_ok "Права установлены"

          # 12. ЗАПУСК СЛУЖБ
          log_info "Запуск служб..."
          systemctl start sssd
          sleep 3
          systemctl start autofs
          sleep 1
          if systemctl is-active --quiet sssd && systemctl is-active --quiet autofs; then
              log_ok "SSSD и autofs успешно запущены"
          else
              log_error "Ошибка запуска служб"
              systemctl status sssd --no-pager || true
              systemctl status autofs --no-pager || true
              exit 1
          fi
          systemctl enable sssd 2>/dev/null || true
          systemctl enable autofs 2>/dev/null || true

          # 13. ПРОВЕРКА
          log_info "Проверка работы..."
          sss_cache -E 2>/dev/null || true
          sleep 2
          if klist -kt /etc/krb5.keytab 2>/dev/null | grep -q "host/${FULL_HOSTNAME}"; then
              log_ok "Keytab содержит правильный хост"
          else
              log_error "Keytab содержит неправильный хост!"
              klist -kt /etc/krb5.keytab 2>/dev/null | grep host || echo "  (пусто)"
          fi
          if id student >/dev/null 2>&1; then
              log_ok "Пользователь student найден!"
              STUDENT_HOME=$(getent passwd student | cut -d: -f6)
              log_info "Домашняя папка: $STUDENT_HOME"
          else
              log_warn "Пользователь student не найден, возможно кэш еще не обновился"
          fi
          if su student -c "whoami" > /dev/null 2>&1; then
              log_ok "su student работает!"
          else
              log_warn "su student не работает"
          fi

          # 14. ZABBIX
          if [ -f /etc/zabbix/zabbix_agentd.conf ]; then
              log_info "Настройка Zabbix агента..."
              sed -i 's/^Server=.*/Server=10.205.112.6/' /etc/zabbix/zabbix_agentd.conf
              sed -i 's/^ServerActive=.*/ServerActive=10.205.112.6/' /etc/zabbix/zabbix_agentd.conf
              sed -i "s/^Hostname=.*/Hostname=${SHORT_HOSTNAME}/" /etc/zabbix/zabbix_agentd.conf
              if systemctl list-unit-files | grep -q "zabbix_agentd.service"; then
                  systemctl enable zabbix_agentd 2>/dev/null || true
                  systemctl restart zabbix_agentd 2>/dev/null || true
                  log_ok "Zabbix Agent перезапущен"
              elif systemctl list-unit-files | grep -q "zabbix-agent2.service"; then
                  systemctl enable zabbix-agent2 2>/dev/null || true
                  systemctl restart zabbix-agent2 2>/dev/null || true
                  log_ok "Zabbix Agent 2 перезапущен"
              fi
          fi

          # 15. ПЕРЕЗАПУСК DM
          log_info "Перезапуск дисплейного менеджера..."
          systemctl restart dm 2>/dev/null || true

          # 15.1. СКРИПТ ЛОКАЛЬНЫХ ЗАГЛУШЕК
          log_info "Создание /usr/local/bin/create_local_fallbacks.sh..."
          cat > /usr/local/bin/create_local_fallbacks.sh << 'SCRIPT_EOF'
          #!/bin/bash
          getent passwd | while IFS=: read -r user _ uid gid _ home shell; do
              [ "$uid" -lt 1000 ] && continue
              [ "$user" == "admin" ] && continue
              [[ "$home" != /mnt/home/* ]] && continue
              if [ ! -d "$home" ]; then
                  mkdir -p "$home"
                  cp -r /etc/skel/. "$home/" 2>/dev/null
                  chown "$uid:$gid" "$home"
                  chmod 700 "$home"
                  echo "Создана локальная заглушка: $home"
              else
                  current_owner=$(stat -c '%u:%g' "$home")
                  if [ "$current_owner" != "$uid:$gid" ]; then
                      chown "$uid:$gid" "$home"
                      chmod 700 "$home"
                      echo "Исправлен владелец заглушки: $home ($current_owner -> $uid:$gid)"
                  fi
              fi
          done
          echo "=== Готово ==="
          SCRIPT_EOF
          chmod +x /usr/local/bin/create_local_fallbacks.sh
          log_ok "Скрипт create_local_fallbacks.sh создан"

          # 15.2. SYSTEMD-ЮНИТ
          log_info "Создание /etc/systemd/system/create-local-fallbacks.service..."
          cat > /etc/systemd/system/create-local-fallbacks.service << 'UNIT_EOF'
          [Unit]
          Description=Create local fallback home directories from FreeIPA
          After=sssd.service network-online.target
          Wants=network-online.target
          Before=autofs.service
          Requires=sssd.service

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/create_local_fallbacks.sh
          RemainAfterExit=yes

          [Install]
          WantedBy=multi-user.target
          UNIT_EOF
          chmod 644 /etc/systemd/system/create-local-fallbacks.service
          systemctl daemon-reload
          systemctl enable create-local-fallbacks.service 2>/dev/null || true
          log_ok "Юнит create-local-fallbacks.service создан и включён"

          # 15.3. SSH
          log_info "Включение PasswordAuthentication в SSH..."
          SSHD_CONFIG="/etc/openssh/sshd_config"
          [ ! -f "$SSHD_CONFIG" ] && SSHD_CONFIG="/etc/ssh/sshd_config"
          if [ -f "$SSHD_CONFIG" ]; then
              sed -i 's/^#\s*PasswordAuthentication\s\+yes/PasswordAuthentication yes/' "$SSHD_CONFIG"
              if ! grep -qE '^\s*PasswordAuthentication\s' "$SSHD_CONFIG"; then
                  echo "PasswordAuthentication yes" >> "$SSHD_CONFIG"
              fi
              systemctl restart sshd 2>/dev/null || systemctl restart ssh 2>/dev/null || true
              log_ok "SSH: PasswordAuthentication включён, служба перезапущена"
          else
              log_warn "Не найден sshd_config, пропускаем настройку SSH"
          fi

          # 15.4. КЭШ
          log_info "Настройка перенаправления пользовательского кэша..."
          mkdir -p /var/tmp/user_cache
          chmod 1777 /var/tmp/user_cache
          chown root:root /var/tmp/user_cache
          cat > /etc/profile.d/redirect_cache.sh << 'CACHE_EOF'
          #!/bin/bash
          [ "$(id -u)" -lt 1000 ] && return 2>/dev/null
          LOCAL_CACHE="/var/tmp/user_cache/${USER}"
          if [ ! -d "$LOCAL_CACHE" ]; then
              mkdir -p "$LOCAL_CACHE" 2>/dev/null
              chmod 700 "$LOCAL_CACHE"
          fi
          export XDG_CACHE_HOME="$LOCAL_CACHE"
          CACHE_EOF
          chmod 755 /etc/profile.d/redirect_cache.sh
          chown root:root /etc/profile.d/redirect_cache.sh
          log_ok "Перенаправление кэша настроено (без очистки)"

          # 15.5. ID VIEW
          log_info "Создание локальных каталогов для ID View..."
          LOCAL_HOME_USERS=(
              "student:/home/student"
          )
          for entry in "${LOCAL_HOME_USERS[@]}"; do
              LOCAL_USER="${entry%%:*}"
              LOCAL_HOME="${entry##*:}"
              if ! id "$LOCAL_USER" >/dev/null 2>&1; then
                  log_warn "Пользователь $LOCAL_USER не найден, пропускаем"
                  continue
              fi
              LOCAL_UID=$(id -u "$LOCAL_USER")
              LOCAL_GID=$(id -g "$LOCAL_USER")
              if [ ! -d "$LOCAL_HOME" ]; then
                  mkdir -p "$LOCAL_HOME"
                  cp -r /etc/skel/. "$LOCAL_HOME/" 2>/dev/null
                  chown -R "$LOCAL_UID:$LOCAL_GID" "$LOCAL_HOME"
                  chmod 700 "$LOCAL_HOME"
                  log_ok "Создан локальный профиль: $LOCAL_HOME ($LOCAL_UID:$LOCAL_GID)"
              else
                  CURRENT_OWNER=$(stat -c '%u:%g' "$LOCAL_HOME")
                  if [ "$CURRENT_OWNER" != "$LOCAL_UID:$LOCAL_GID" ]; then
                      chown -R "$LOCAL_UID:$LOCAL_GID" "$LOCAL_HOME"
                      chmod 700 "$LOCAL_HOME"
                      log_ok "Исправлен владелец: $LOCAL_HOME ($CURRENT_OWNER -> $LOCAL_UID:$LOCAL_GID)"
                  else
                      log_info "Локальный профиль уже существует: $LOCAL_HOME"
                  fi
              fi
          done
          log_ok "Локальные каталоги для ID View настроены"

          # 16. ИТОГИ
          print_sep
          log_ok "=== НАСТРОЙКА УСПЕШНО ЗАВЕРШЕНА! ==="
          print_sep
          log_info "Имя хоста: $FULL_HOSTNAME"
          log_info "Домен: $IPA_DOMAIN"
          log_info "Сервер IPA: $IPA_SERVER"
          log_info "Статус SSSD: $(systemctl is-active sssd)"
          log_info "Статус autofs: $(systemctl is-active autofs)"
          print_sep
          log_info "Проверка keytab:"
          klist -kt /etc/krb5.keytab 2>/dev/null | grep host || echo "  (ошибка)"
          print_sep
          log_ok "Машина готова к работе!"
          print_sep

          # 17. ADMIN В WHEEL
          log_info "Добавление доменного пользователя admin в группу wheel..."
          if id admin >/dev/null 2>&1; then
              if getent group wheel >/dev/null 2>&1; then
                  if usermod -aG wheel admin 2>/dev/null; then
                      log_ok "Пользователь admin добавлен в группу wheel"
                  else
                      log_warn "Не удалось добавить admin в wheel через usermod, пробуем gpasswd..."
                      if gpasswd -a admin wheel 2>/dev/null; then
                          log_ok "Пользователь admin добавлен в группу wheel (gpasswd)"
                      else
                          log_error "Не удалось добавить admin в группу wheel"
                      fi
                  fi
                  log_info "Группы пользователя admin: $(id -nG admin 2>/dev/null || echo 'н/д')"
              else
                  log_warn "Группа wheel не найдена в системе — пропускаем"
              fi
          else
              log_warn "Доменный пользователь admin не найден"
          fi

          print_sep
          log_ok "Скрипт завершён."
          print_sep

    - name: Запустить fix_sssd.sh
      ansible.builtin.command:
        cmd: "{{ fix_script_path }}"
      register: fix_result
      changed_when: true

    - name: Показать вывод скрипта
      ansible.builtin.debug:
        var: fix_result.stdout_lines
        # ================================================================
    # 18. НАСТРОЙКА ПРОКСИ ПО ГРУППАМ
    # ================================================================

    - name: Создать /usr/local/bin/setup_proxy_by_group.sh
      ansible.builtin.copy:
        dest: /usr/local/bin/setup_proxy_by_group.sh
        owner: root
        group: root
        mode: '0755'
        content: |
          #!/bin/bash
          # /usr/local/bin/setup_proxy_by_group.sh
          #
          # Настраивает прокси-сервер в зависимости от группы пользователя.
          #
          # Что делает:
          #   1. Удаляет глобальные строки HTTP_PROXY/HTTPS_PROXY/FTP_PROXY/NO_PROXY
          #      из /etc/sysconfig/network (с резервной копией).
          #   2. Отключает /etc/profile.d/proxy.sh и /etc/profile.d/proxy.csh,
          #      которые прописывают прокси ВСЕМ пользователям.
          #   3. Создаёт /etc/profile.d/proxy_by_group.sh, который:
          #        - группе students  → выставляет прокси
          #        - группе teachers  → убирает прокси (прямой доступ)
          #        - остальным        → убирает прокси
          #
          # Запуск: от root.

          set -e

          # ================================================================
          # КОНФИГУРАЦИЯ
          # ================================================================

          STUDENT_PROXY="http://10.0.2.52:3128"
          STUDENT_NO_PROXY="localhost,127.0.0.1,.local,10.0.0.0/8,.licey.loc"

          SYSCTL_FILE="/etc/sysconfig/network"
          PROFILE_SCRIPT="/etc/profile.d/proxy_by_group.sh"
          BACKUP_FILE="/etc/sysconfig/network.bak.$(date +%Y%m%d-%H%M%S)"
          TIMESTAMP="$(date +%Y%m%d-%H%M%S)"

          LEGACY_PROXY_FILES=(
              "/etc/profile.d/proxy.sh"
              "/etc/profile.d/proxy.csh"
          )

          # ================================================================
          # ПРОВЕРКИ
          # ================================================================

          if [ "$EUID" -ne 0 ]; then
              echo "Ошибка: скрипт должен запускаться от root"
              exit 1
          fi

          if [ ! -f "$SYSCTL_FILE" ]; then
              echo "Ошибка: $SYSCTL_FILE не найден"
              exit 1
          fi

          echo "================================================================"
          echo "Настройка прокси по группам"
          echo "================================================================"

          # ================================================================
          # ШАГ 1. УДАЛЯЕМ ПРОКСИ ИЗ /etc/sysconfig/network
          # ================================================================

          echo ""
          echo "[1/3] Очистка $SYSCTL_FILE от глобальных прокси..."

          cp -a "$SYSCTL_FILE" "$BACKUP_FILE"
          echo "  Резервная копия: $BACKUP_FILE"

          sed -i -E '/^[[:space:]]*(HTTP_PROXY|HTTPS_PROXY|FTP_PROXY|NO_PROXY|http_proxy|https_proxy|ftp_proxy|no_proxy)[[:space:]]*=/d' "$SYSCTL_FILE"

          echo "  Строки прокси удалены"
          echo ""
          echo "  --- Текущее содержимое $SYSCTL_FILE ---"
          cat "$SYSCTL_FILE"
          echo "  ---------------------------------------"

          # ================================================================
          # ШАГ 2. ОТКЛЮЧАЕМ LEGACY-СКРИПТЫ В /etc/profile.d/
          # ================================================================

          echo ""
          echo "[2/3] Отключение legacy-скриптов, прописывающих прокси всем..."

          DISABLED_ANY=0

          for LEGACY_FILE in "${LEGACY_PROXY_FILES[@]}"; do
              if [ -f "$LEGACY_FILE" ]; then
                  DISABLED_NAME="${LEGACY_FILE}.disabled.${TIMESTAMP}"
                  mv "$LEGACY_FILE" "$DISABLED_NAME"
                  echo "  Отключён: $LEGACY_FILE → $DISABLED_NAME"
                  DISABLED_ANY=1
              else
                  echo "  Не найден (уже отключён?): $LEGACY_FILE"
              fi
          done

          if [ "$DISABLED_ANY" -eq 0 ]; then
              echo "  Legacy-скриптов не найдено — ничего отключать не нужно"
          fi

          echo ""
          echo "  Проверка /etc/profile.d/ на другие источники прокси..."

          OTHER_PROXY_FILES=$(grep -l -E '(export|unset).*(http_proxy|https_proxy|ftp_proxy|no_proxy|HTTP_PROXY|HTTPS_PROXY|FTP_PROXY|NO_PROXY)' \
              /etc/profile.d/*.sh 2>/dev/null | grep -v "$PROFILE_SCRIPT" || true)

          if [ -n "$OTHER_PROXY_FILES" ]; then
              echo "  ВНИМАНИЕ: найдены другие скрипты с прокси:"
              echo "$OTHER_PROXY_FILES" | while read -r f; do
                  echo "    - $f"
              done
              echo "  Проверьте их вручную — возможно, они тоже перебивают групповую логику."
          else
              echo "  Других источников прокси не найдено"
          fi

          # ================================================================
          # ШАГ 3. СОЗДАЁМ СКРИПТ /etc/profile.d/proxy_by_group.sh
          # ================================================================

          echo ""
          echo "[3/3] Создание $PROFILE_SCRIPT..."

          cat > "$PROFILE_SCRIPT" << 'PROFILE_EOF'
          #!/bin/bash
          # /etc/profile.d/proxy_by_group.sh
          #
          # Настраивает переменные окружения прокси в зависимости от группы пользователя.
          # Работает при каждом входе в систему (login shell, su -, ssh).

          STUDENT_PROXY="http://10.0.2.52:3128"
          STUDENT_NO_PROXY="localhost,127.0.0.1,.local,10.0.0.0/8,.licey.loc"

          # Принудительно очищаем все прокси-переменные
          unset HTTP_PROXY HTTPS_PROXY FTP_PROXY NO_PROXY
          unset http_proxy https_proxy ftp_proxy no_proxy

          USER_GROUPS=$(id -nG "$USER" 2>/dev/null)

          if echo "$USER_GROUPS" | tr ' ' '\n' | grep -qx "students"; then
              export HTTP_PROXY="$STUDENT_PROXY"
              export HTTPS_PROXY="$STUDENT_PROXY"
              export FTP_PROXY="$STUDENT_PROXY"
              export NO_PROXY="$STUDENT_NO_PROXY"

              export http_proxy="$STUDENT_PROXY"
              export https_proxy="$STUDENT_PROXY"
              export ftp_proxy="$STUDENT_PROXY"
              export no_proxy="$STUDENT_NO_PROXY"
          fi
          PROFILE_EOF

          chmod 755 "$PROFILE_SCRIPT"
          chown root:root "$PROFILE_SCRIPT"

          echo "  Скрипт создан и сделан исполняемым"

          # ================================================================
          # ИТОГИ
          # ================================================================

          echo ""
          echo "================================================================"
          echo "Готово!"
          echo "================================================================"
          echo "Что сделано:"
          echo "  1. Из $SYSCTL_FILE удалены глобальные прокси"
          echo "  2. Отключены legacy-скрипты в /etc/profile.d/ (proxy.sh, proxy.csh)"
          echo "  3. Создан $PROFILE_SCRIPT"
          echo ""
          echo "Логика прокси:"
          echo "  students → $STUDENT_PROXY"
          echo "  teachers → без прокси"
          echo "  остальные → без прокси"
          echo "================================================================"

    - name: Запустить setup_proxy_by_group.sh
      ansible.builtin.command:
        cmd: /usr/local/bin/setup_proxy_by_group.sh
      register: proxy_result
      changed_when: true

    - name: Показать вывод настройки прокси
      ansible.builtin.debug:
        var: proxy_result.stdout_lines
